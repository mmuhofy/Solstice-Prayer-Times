name: Release APK

# Builds + signs release APKs on tag push (`v*`) or manual dispatch, then attaches
# the signed APKs (universal + per-ABI) to a GitHub release. APK-only — no
# Android App Bundle / Play Store target (fork's primary distribution is
# F-Droid, GitHub releases, and user-side sideloading).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build from (branch / tag / sha). Defaults to the default branch.'
        required: false
      create_release:
        description: 'Create / update a GitHub release draft for this build.'
        required: false
        default: 'true'
      tag_name:
        description: 'Release tag name to use when create_release is true. Ignored if running on tag push.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign, and attach APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve build ref
        id: ref
        run: |
          set -euo pipefail
          REF="${{ inputs.ref }}"
          case "$REF" in
            refs/tags/*|refs/heads/*) REF="${REF#refs/*/}" ;;
            '') REF="${{ github.ref_name }}" ;;
          esac
          echo "value=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.value }}

      - name: Set up JDK 21 (matches gradle-daemon-jvm.properties)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Compute release coords from version info
        id: version
        run: |
          set -euo pipefail
          vn=$(awk -F\" '/versionName/{print $2; exit}' app/build.gradle.kts)
          vc=$(awk -F' *= *' '/versionCode[[:space:]]*=/{print $2; exit}' app/build.gradle.kts | tr -d ' ')
          echo "versionName=$vn" >> "$GITHUB_OUTPUT"
          echo "versionCode=$vc" >> "$GITHUB_OUTPUT"
          echo "versionCodeArtifact=$((vc * 1000))" >> "$GITHUB_OUTPUT"

      - name: Assemble release APKs (universal + per-ABI)
        run: ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Stage APKs with friendly names
        working-directory: app/build/outputs
        run: |
          set -euo pipefail
          shopt -s nullglob
          VN="${{ steps.version.outputs.versionName }}"
          VC="${{ steps.version.outputs.versionCode }}"

          mkdir -p staging/apk
          pkgs=()
          while IFS= read -r f; do pkgs+=("$f"); done < <(find apk/release -maxdepth 2 -type f -name '*.apk' | sort)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "No APKs found in apk/release" >&2
            exit 1
          fi
          echo "Found ${#pkgs[@]} APK(s)"
          for f in "${pkgs[@]}"; do
            rel=${f#apk/release/}
            base=$(basename "$rel" .apk)
            safe=${base%-release}
            arch="-universal"
            case "$safe" in
              *arm64-v8a*) arch="-arm64-v8a" ;;
              *armeabi-v7a*) arch="-armeabi-v7a" ;;
              *x86_64*) arch="-x86_64" ;;
              *x86*) arch="-x86" ;;
            esac
            dst="staging/apk/solstice-prayer-times--${VN}${arch}-${VC}.apk"
            mv "$f" "$dst"
            echo "APK: $dst"
          done

      - name: Sign APKs
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/staging/apk
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '36.0.0'

      - name: Verify signed artifacts
        working-directory: app/build/outputs/staging
        run: |
          set -euo pipefail
          shopt -s nullglob
          test -n "$(echo apk/*-signed.apk 2>/dev/null)" || {
            echo "No signed APKs found" >&2; exit 1;
          }
          ls -la apk

      - name: Drop the unsig APK copies, keep -signed.apk only
        working-directory: app/build/outputs/staging/apk
        run: |
          set -euo pipefail
          for f in *.apk; do
            case "$f" in
              *-signed.apk) ;;
              *) rm -f "$f" ;;
            esac
          done
          ls -la

      - name: Determine release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="${{ github.ref }}"
            case "$REF" in
              refs/tags/*) echo "value=${REF#refs/tags/}" >> "$GITHUB_OUTPUT" ;;
              *) echo "value=manual-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            INPUT_TAG="${{ inputs.tag_name }}"
            if [ -z "${INPUT_TAG:-}" ]; then
              INPUT_TAG="v${{ steps.version.outputs.versionName }}"
            fi
            echo "value=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub release (draft)
        if: ${{ github.event_name != 'pull_request' && (inputs.create_release != 'false') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: 'Solstice Prayer Times ${{ steps.tag.outputs.value }}'
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
          files: app/build/outputs/staging/apk/*.apk

      - name: Upload artifacts (workflow_dispatch only, no release)
        if: ${{ github.event_name != 'push' && inputs.create_release == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apks
          path: app/build/outputs/staging/apk/*.apk
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### Release APK build complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          vn=$(awk -F\" '/versionName/{print $2; exit}' app/build.gradle.kts)
          vc=$(awk -F' *= *' '/versionCode[[:space:]]*=/{print $2; exit}' app/build.gradle.kts | tr -d ' ')
          echo "- Version: \`$vn\` (code $vc, on-device $((vc * 1000)))" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ steps.tag.outputs.value }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r f; do
            size=$(du -h "$f" | cut -f1)
            echo "| \`$(basename "$f")\` | $size |" >> "$GITHUB_STEP_SUMMARY"
          done < <(find app/build/outputs/staging -type f -name '*-signed.apk' | sort)

  build-debug-apk:
    name: Debug APK sanity check
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  lint-and-tests:
    name: Static checks + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run lint + :app:check (incl. banMutableCollectionTypes)
        run: ./gradlew --no-daemon :app:check -x test
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results-debug
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
      - name: Run release unit tests (best-effort)
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testReleaseUnitTest
